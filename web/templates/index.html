<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BananaSplit</title>
	<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
	<main class="landing-shell">
		<section class="landing-card">
			<span class="logo landing-logo">BS</span>
			<h1>BananaSplit</h1>
			<p class="landing-question">What would you like to do?</p>
			<div class="choice-grid">
				<a class="choice-card choice-card-active" href="/wallets/new">
					<strong>Create a new wallet</strong>
					<span>Set up a shared household budget.</span>
				</a>
				<div class="choice-card choice-card-disabled" aria-disabled="true">
					<strong>Join an existing wallet</strong>
					<span>Coming soon.</span>
				</div>
			</div>
			{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
		</section>
	</main>
</body>
</html>
