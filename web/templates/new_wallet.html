<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Create a wallet · BananaSplit</title>
	<meta name="theme-color" content="#1f6f54">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="BananaSplit">
	<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{assetVersion "apple-touch-icon.png"}}">
	<link rel="stylesheet" href="/static/styles.css?v={{assetVersion "styles.css"}}">
</head>
<body>
	<main class="shell narrow-shell">
		<header class="app-header">
			<a class="brand" href="/"><img class="logo" src="/static/logo.svg?v={{assetVersion "logo.svg"}}" alt=""><span>BananaSplit</span></a>
			<a class="back-link" href="/">← Home</a>
		</header>
		<section class="panel setup-panel">
			<p class="eyebrow">Create a wallet</p>
			<h1>Who will share this budget?</h1>
			<form class="stack-form" method="post" action="/wallets">
				<label for="wallet-name">Wallet name</label>
				<input id="wallet-name" name="name" placeholder="Our home" required autofocus>
				<div>
					<label>Organise this wallet by</label>
					<p class="field-help">Each period becomes its own pane with its own expenses and totals.</p>
					<div class="period-choice">
						<label class="period-option"><input type="radio" name="period" value="daily"><span><strong>Daily</strong><small>One pane per day</small></span></label>
						<label class="period-option"><input type="radio" name="period" value="monthly" checked><span><strong>Monthly</strong><small>One pane per month</small></span></label>
						<label class="period-option"><input type="radio" name="period" value="yearly"><span><strong>Yearly</strong><small>One pane per year</small></span></label>
					</div>
				</div>
				<div>
					<label>Start from</label>
					<p class="field-help">The first pane. You can add more periods later. Leave empty to start today.</p>
					<div class="period-start">
						<span class="start-field" data-type="daily" hidden>
							<input type="date" lang="en" name="start" aria-label="Start day" disabled>
						</span>
						<span class="start-field" data-type="monthly">
							<select name="start_month" aria-label="Start month">
								<option value="">Month</option>
								<option value="01">January</option>
								<option value="02">February</option>
								<option value="03">March</option>
								<option value="04">April</option>
								<option value="05">May</option>
								<option value="06">June</option>
								<option value="07">July</option>
								<option value="08">August</option>
								<option value="09">September</option>
								<option value="10">October</option>
								<option value="11">November</option>
								<option value="12">December</option>
							</select>
							<input type="number" name="start_year" min="2000" max="2100" step="1" placeholder="Year" aria-label="Start year">
						</span>
						<span class="start-field" data-type="yearly" hidden>
							<input type="number" name="start" min="2000" max="2100" step="1" placeholder="2026" aria-label="Start year" disabled>
						</span>
					</div>
				</div>
				<div>
					<label>Participants</label>
					<p class="field-help">Add everyone who will contribute to this wallet.</p>
					<div id="participants" class="participant-inputs">
						<input name="people" placeholder="Name" required>
						<input name="people" placeholder="Name">
					</div>
					<button class="text-button" id="add-participant" type="button">+ Add another person</button>
				</div>
				<button type="submit">Create wallet</button>
			</form>
		</section>
	</main>
	<script>
		document.getElementById('add-participant').addEventListener('click', function () {
			const input = document.createElement('input');
			input.name = 'people';
			input.placeholder = 'Name';
			document.getElementById('participants').appendChild(input);
			input.focus();
		});

		// Show only the "Start from" control that matches the chosen granularity.
		// Disabled fields are not submitted, so only the active one sends a value.
		function syncStartInput() {
			const selected = document.querySelector('input[name="period"]:checked').value;
			document.querySelectorAll('.start-field').forEach(function (field) {
				const active = field.dataset.type === selected;
				field.hidden = !active;
				field.querySelectorAll('input, select').forEach(function (el) {
					el.disabled = !active;
				});
			});
		}
		document.querySelectorAll('input[name="period"]').forEach(function (radio) {
			radio.addEventListener('change', syncStartInput);
		});
		syncStartInput();
	</script>
</body>
</html>
